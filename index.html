<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Medieval Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'medieval': ['MedievalSharp', 'cursive'],
              'sans': ['Roboto', 'sans-serif'],
            },
            colors: {
              'stone-dark': '#2a323c', // Fundo escuro para componentes
              'off-white': '#EAEAEA', // Cor primária do texto
              'wood': '#8c6d5e', // Um tom de madeira para acentos
              'ink': '#1a1a1a', // Fundo principal da página, bem escuro
              'gold': '#FFD700', // Cor de destaque
              'steel': '#A9A9A9', // Para bordas e estados desabilitados
            },
            boxShadow: {
              'inset-strong': 'inset 0 4px 12px rgba(0,0,0,0.6)',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
